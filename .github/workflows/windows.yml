name: Windows build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPULSAR_BUILD_DESKTOP=ON
          -DPULSAR_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build

      - name: Version smoke test
        run: ./build/apps/pulsar-desktop/pulsar-desktop.exe --version

      - name: Bundle
        run: ./packaging/windows/bundle.sh build dist/PULSAR-windows-x86_64

      - name: Launch smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/PULSAR-windows-x86_64/pulsar-desktop.exe --smoke-exit-ms 500

      - name: Zip
        run: cd dist && zip -qr PULSAR-windows-x86_64.zip PULSAR-windows-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: PULSAR-windows-x86_64
          path: dist/PULSAR-windows-x86_64.zip
