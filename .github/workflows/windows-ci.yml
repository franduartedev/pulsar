name: Windows CI

on:
  push:
    branches: [main, feature/pulsar-audio-fx, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record source revision
        shell: pwsh
        run: |
          $headSha = "${{ github.event.pull_request.head.sha || github.sha }}"
          $workflowSha = "${{ github.sha }}"
          $checkoutSha = (git rev-parse HEAD).Trim()
          if ($checkoutSha -ne $headSha) {
            throw "Checkout SHA $checkoutSha does not match expected head SHA $headSha."
          }
          "PULSAR_HEAD_SHA=$headSha" >> $env:GITHUB_ENV
          "PULSAR_WORKFLOW_SHA=$workflowSha" >> $env:GITHUB_ENV
          "PULSAR_CHECKOUT_SHA=$checkoutSha" >> $env:GITHUB_ENV
          @(
            "head_sha=$headSha"
            "workflow_sha=$workflowSha"
            "checkout_sha=$checkoutSha"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress --yes

      - name: Cache vcpkg FFmpeg artifacts
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
          key: windows-vcpkg-ffmpeg-x264-zlib-v1-${{ runner.os }}-${{ hashFiles('src/media/ffmpeg/CMakeLists.txt') }}
          restore-keys: |
            windows-vcpkg-ffmpeg-x264-zlib-v1-${{ runner.os }}-

      - name: Install FFmpeg port
        id: vcpkg-install
        shell: pwsh
        run: |
          $vcpkg = (Get-Command vcpkg.exe).Source
          $vcpkgRoot = Split-Path -Parent $vcpkg
          vcpkg install ffmpeg[x264,zlib]:x64-windows --disable-metrics
          "PULSAR_VCPKG_TOOLCHAIN=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "PULSAR_VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      # Persist the expensive port build before the test gate. A failing test
      # must not force the next Windows iteration to rebuild FFmpeg from zero.
      - name: Save vcpkg FFmpeg artifacts
        if: ${{ steps.vcpkg-install.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # Test-only dependency: the vcpkg ffmpeg port ships libraries without the
      # CLI, so integration tests use a separately installed CLI. It is never
      # linked into the product.
      - name: Install FFmpeg CLI for tests
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress --yes
          $ffmpeg = Join-Path $env:ProgramData 'chocolatey\bin\ffmpeg.exe'
          if (-not (Test-Path $ffmpeg)) {
            $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          }
          "PULSAR_TEST_FFMPEG_CLI=$ffmpeg" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:PULSAR_VCPKG_TOOLCHAIN"
          -DPULSAR_BUILD_DESKTOP=ON
          -DPULSAR_TEST_FFMPEG_CLI="$env:PULSAR_TEST_FFMPEG_CLI"

      - name: Build
        # vcpkg's z-applocal post-link step copies the same FFmpeg DLLs into
        # the shared test directory. Parallel Ninja links race on those files
        # and intermittently fail with ERROR_SHARING_VIOLATION.
        run: cmake --build build --parallel 1

      - name: Test
        id: tests
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure

      # Packaging must not depend on the test gate: a runnable .exe is
      # needed to try the editor while individual tests are being fixed.
      - name: Package portable bundle
        shell: pwsh
        env:
          PULSAR_EXPECTED_VERSION: 0.2.0-beta.2
        run: .\packaging\windows\build-release.ps1 -BuildDir build -OutputDir dist -VcpkgRoot "$env:PULSAR_VCPKG_ROOT"

      - name: Verify Windows package
        shell: pwsh
        run: |
          $archive = Join-Path $pwd "dist/PULSAR-0.2.0-beta.2-windows-x86_64.zip"
          if (-not (Test-Path $archive)) { throw "Expected beta.2 Windows package was not generated." }
          $fixArchive = Join-Path $pwd "dist/PULSAR-beta2-fix-test-windows-x86_64.zip"
          Copy-Item -LiteralPath $archive -Destination $fixArchive -Force
          if (-not (Test-Path $fixArchive)) { throw "Named beta.2 fix test package was not generated." }
          $verify = Join-Path $env:RUNNER_TEMP "pulsar-beta2-package-check"
          Remove-Item -Recurse -Force $verify -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $verify
          $metadata = Join-Path $verify "BUILD-METADATA.txt"
          if (-not (Test-Path $metadata)) { throw "Package is missing BUILD-METADATA.txt." }
          $metadataText = Get-Content $metadata -Raw
          foreach ($required in @(
            "PULSAR_VERSION=0.2.0-beta.2",
            "PULSAR_HEAD_SHA=$env:PULSAR_HEAD_SHA",
            "PULSAR_CHECKOUT_SHA=$env:PULSAR_CHECKOUT_SHA"
          )) {
            if ($metadataText -notlike "*$required*") { throw "Package metadata is missing: $required" }
          }
          $binary = [IO.File]::ReadAllBytes((Join-Path $verify "bin/pulsar-desktop.exe"))
          $needle = [Text.Encoding]::ASCII.GetBytes("0.2.0-beta.2")
          $found = $false
          for ($i = 0; $i -le $binary.Length - $needle.Length; $i++) {
            $match = $true
            for ($j = 0; $j -lt $needle.Length; $j++) {
              if ($binary[$i + $j] -ne $needle[$j]) { $match = $false; break }
            }
            if ($match) { $found = $true; break }
          }
          if (-not $found) { throw "The packaged executable does not contain the beta.2 version marker." }
          if (-not (Test-Path (Join-Path $verify "LICENSE.txt")) -or
              -not (Test-Path (Join-Path $verify "THIRD_PARTY_NOTICES.md"))) {
            throw "Package is missing required license notices."
          }

      - name: Smoke-test packaged desktop with persisted cut project
        shell: pwsh
        run: |
          $qa = Join-Path $env:RUNNER_TEMP "pulsar-real-desktop-smoke"
          Remove-Item -Recurse -Force $qa -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $qa | Out-Null
          $media = Join-Path $qa "synthetic audio [CI] #1.mp4"
          & ffmpeg -y -hide_banner -loglevel error `
            -f lavfi -i "testsrc=size=320x180:rate=30" `
            -f lavfi -i "sine=frequency=440:sample_rate=48000" `
            -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k $media
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $media)) { throw "Synthetic media generation failed." }
          $mediaLocator = $media.Replace('\', '/')
          $project = Join-Path $qa "persisted cut [CI] #1.pulsar"
          $projectLines = @(
            "PULSAR_PROJECT 1"
            "TIMELINE 4"
            "TRACK 8 VIDEO"
            "VIDEO_TRACK 8"
            "ASSET 2 0 2 1 1 `"$mediaLocator`" `"h264`" 320 180 1 15360 30 1 `"mov,mp4,m4a,3gp,3g2,mj2`" AUDIO 1 48000 1 1 48000 2 1 1"
            "CLIP 20 8 2 0 1 1 1 1 0 1 1"
            "CLIP 21 8 2 1 1 1 2 1 1 1 1 1"
            "ALLOCATOR 10 30 5 9"
            "END"
          )
          [IO.File]::WriteAllText($project, ($projectLines -join "`n") + "`n", (New-Object Text.UTF8Encoding($false)))
          $build = (Resolve-Path "build").Path
          $stage = Join-Path $build "packaging-stage/PULSAR"
          $exe = Join-Path $stage "bin/pulsar-desktop.exe"
          $shot = Join-Path $qa "persisted-cut.png"
          $pcm = Join-Path $qa "playback-pcm.log"
          $stdout = Join-Path $qa "stdout.log"
          $stderr = Join-Path $qa "stderr.log"
          $oldPlatform = $env:QT_QPA_PLATFORM
          $oldQaWorkspace = $env:PULSAR_QA_WORKSPACE
          $oldQaPcm = $env:PULSAR_QA_PCM_PATH
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PULSAR_QA_WORKSPACE = $qa
          $env:PULSAR_QA_PCM_PATH = $pcm
          try {
            $arguments = '"{0}" --smoke-size 1280x720 --smoke-exit-ms 9000 --smoke-screenshot "{1}" --qa-playback-ms 6500 --qa-pause-after-ms 3000 --qa-resume-after-ms 4200 --dump-performance-on-exit' -f $project, $shot
            $process = Start-Process -FilePath $exe -ArgumentList $arguments `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "Packaged desktop exited with code $($process.ExitCode)." }
          } finally {
            $env:QT_QPA_PLATFORM = $oldPlatform
            $env:PULSAR_QA_WORKSPACE = $oldQaWorkspace
            $env:PULSAR_QA_PCM_PATH = $oldQaPcm
          }
          if (-not (Test-Path $shot)) { throw "Packaged desktop did not produce a screenshot." }
          $errorText = Get-Content $stderr -Raw
          if ($errorText -match "open project failed|media file does not exist|cannot decode project") {
            throw "Packaged desktop failed to open the persisted cut project: $errorText"
          }
          $metrics = Get-Content $stdout -Raw
          if ($metrics -notmatch "audio.source_opens=[1-9][0-9]*") {
            throw "Playback did not open an audio source. Metrics: $metrics"
          }
          if ($metrics -notmatch "audio.render_p95_us=[1-9][0-9]*") {
            throw "Playback produced no measurable PCM render. Metrics: $metrics"
          }
          if (-not (Test-Path $pcm) -or (Get-Item $pcm).Length -lt 100) {
            throw "Playback PCM capture is missing or empty."
          }
          $pcmText = Get-Content $pcm -Raw
          $blockCount = ([regex]::Matches($pcmText, "(?m)^BLOCK ")).Count
          if ($blockCount -lt 2) { throw "Playback PCM capture contains fewer than two blocks." }
          Write-Host "Packaged desktop playback passed; screenshot bytes: $((Get-Item $shot).Length); PCM blocks: $blockCount"

      - name: Generate Windows SHA256SUMS
        shell: pwsh
        run: |
          $archive = Get-Item "dist/PULSAR-0.2.0-beta.2-windows-x86_64.zip"
          $fixArchive = Get-Item "dist/PULSAR-beta2-fix-test-windows-x86_64.zip"
          @(
            "{0}  {1}" -f (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant(), $archive.Name
            "{0}  {1}" -f (Get-FileHash $fixArchive -Algorithm SHA256).Hash.ToLowerInvariant(), $fixArchive.Name
          ) | Set-Content "dist/SHA256SUMS" -Encoding ascii

      - name: Upload portable bundle and checksum
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-windows-beta-2
          path: |
            dist/PULSAR-0.2.0-beta.2-windows-x86_64.zip
            dist/PULSAR-beta2-fix-test-windows-x86_64.zip
            dist/SHA256SUMS

      - name: Fail job if tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        shell: pwsh
        run: |
          Write-Error "ctest failed; the portable bundle was still uploaded."
          exit 1
